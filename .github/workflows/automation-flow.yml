name: Daily Backend Automation Pipeline

on:
  schedule:
    # 8:30 AM IST (Scrape & Batch)
    - cron: '0 3 * * *'
    # 10:30 AM IST (Process Batch 1 + Reels)
    - cron: '0 5 * * *'
    # 1:30 PM IST (Process Batch 2)
    - cron: '0 8 * * *'
    # 5:30 PM IST (Process Batch 3 + Reels)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      manual_task:
        description: 'Force run a batch'
        required: false
        type: choice
        options:
          - batch1
          - batch2
          - batch3
          - scrape

jobs:
  automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd backend
          npm install

      - name: Run Pipeline Step
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd backend
          # Determine task based on time (UTC)
          HOUR=$(date +%H)
          
          if [ "$HOUR" == "03" ] || [ "${{ github.event.inputs.manual_task }}" == "scrape" ]; then
            echo "☀️ [8:30 AM IST] Scraping and Batching..."
            node scrapeAndBatch.js
          
          elif [ "$HOUR" == "05" ] || [ "${{ github.event.inputs.manual_task }}" == "batch1" ]; then
            echo "🔥 [10:30 AM IST] Processing Batch 1 (Videos + Content)..."
            node processBatch.js batch1 true
          
          elif [ "$HOUR" == "08" ] || [ "${{ github.event.inputs.manual_task }}" == "batch2" ]; then
            echo "🚀 [1:30 PM IST] Processing Batch 2 (Videos + Content)..."
            node processBatch.js batch2 true
          
          elif [ "$HOUR" == "12" ] || [ "${{ github.event.inputs.manual_task }}" == "batch3" ]; then
            echo "🎬 [5:30 PM IST] Processing Batch 3 (Videos + Content)..."
            node processBatch.js batch3 true
          fi

      - name: Commit Generated Assets
        run: |
          git config --global user.name "GitHub Automation"
          git config --global user.email "action@github.com"
          git add backend/output/
          git commit -m "🤖 Auto-generated: Daily Content/Reels [skip ci]" || echo "No files to commit"
          git push
